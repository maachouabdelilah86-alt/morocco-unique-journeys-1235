<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رسالة من يونس</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#3b151b,#120508 65%,#050203);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff}
.wrap{text-align:center;padding:24px;animation:pageIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.line{font-size:clamp(34px,9vw,82px);font-weight:900;line-height:1.2;letter-spacing:-1px;text-shadow:0 8px 35px rgba(0,0,0,.55);animation:pop 1.4s .35s cubic-bezier(.16,1,.3,1) both}
.name{margin-top:26px;font-size:clamp(22px,5vw,42px);font-weight:700;opacity:0;animation:fade 1s 1.5s ease forwards}
.emoji{font-size:clamp(40px,10vw,75px);margin-bottom:12px;animation:bounce 1.2s 2.1s ease both}
@keyframes pageIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{opacity:0;transform:translateY(35px) scale(.65)}70%{transform:translateY(-5px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes bounce{0%{opacity:0;transform:translateY(25px)}60%{opacity:1;transform:translateY(-12px)}100%{transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
<div class="emoji">😂</div>
<div class="line">تفو عليك تفو علييييييييك</div>
<div class="name">من يونس</div>
</div>
</body>
</html>
